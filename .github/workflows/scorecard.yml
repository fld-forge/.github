name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"  # weekly Wednesday 06:30 UTC, after the Python repositories

# Scorecard's publish_results requires: no workflow-level write permissions,
# and id-token: write only on the job running the scorecard action.
permissions: read-all

jobs:
  analysis:
    # continuous governance/security posture audit; results feed the README
    # badge (api.scorecard.dev) and the code-scanning dashboard (SARIF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # upload-sarif to code scanning
      id-token: write  # OIDC token so publish_results can attest the run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
